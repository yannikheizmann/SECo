[project]
name = "seco"
version = "0.1.0"
description = "Sweaty Conversation Agent System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorama==0.4.6",
    "duckduckgo-search==8.0.2",
    "gradio==5.32.1",
    "langchain-chroma==0.2.4",
    "langchain-community==0.3.24",
    "langchain-core==0.3.63",
    "langchain-openai==0.3.19",
    "langchain-tavily==0.2.0",
    "langchain-text-splitters==0.3.8",
    "langgraph==0.4.8",
    "pydantic==2.11.5",
    "python-dotenv==1.1.0",
    "tiktoken==0.9.0",
]

[project.scripts]
seco = "seco.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seco"]

[tool.uv]
# Keep the migrated LangGraph stack aligned with the original lockfile.
constraint-dependencies = [
    "langgraph-checkpoint==2.0.26",
    "langgraph-prebuilt==0.2.2",
    "langgraph-sdk==0.1.70",
]
